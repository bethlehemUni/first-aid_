<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SCAN, LEARN & ACT — امسح الرمز، تعلّم، وتصرّف</title>
<style>
:root{--bg:#fff;--card:#f4f5f8;--tx:#1b2f5b;--red:#9b1c24;--navy:#1b2f5b;--bd:#d9dce4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161f;--card:#1d2330;--tx:#eef0f5;--red:#ff8f96;--navy:#9db8ff;--bd:#343c4f}}
:root[data-theme=dark]{--bg:#12161f;--card:#1d2330;--tx:#eef0f5;--red:#ff8f96;--navy:#9db8ff;--bd:#343c4f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left);overflow-x:hidden}
header{position:relative;background:#1b2f5b;color:#fff;padding:12px 16px}header a{color:#fff}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}.logo{height:84px;display:flex;align-items:center}.logo img{height:100%;width:auto;display:block}
h1{font-size:1.2rem;margin:0}h1 small{display:block;font-weight:400;font-size:.85rem}
nav{display:flex;flex-direction:column;gap:6px;margin-top:8px}nav[hidden]{display:none}nav a,nav button{width:100%;justify-content:center}.top{padding-left:56px;flex-wrap:nowrap}.top .logo{flex:none}.top h1{flex:1;min-width:0;font-size:1rem;line-height:1.5}.top h1 small{font-size:.75rem}#mn{position:absolute;left:12px;top:12px;width:48px;padding:0;justify-content:center;font-size:1.5rem;border-color:#fff;background:transparent;color:#fff}nav a,button,.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--red);background:var(--bg);color:var(--red);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}
nav a{border-color:#fff;background:transparent;color:#fff}.pri{background:var(--red);color:#fff}:root[data-theme=dark] .pri{color:#12161f}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
main{max-width:960px;margin:auto;padding:16px}section{margin:28px 0}h2{color:var(--navy);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{display:flex;flex-direction:column;gap:6px;padding:10px;overflow-wrap:anywhere}.grid .card h3{font-size:1rem;line-height:1.5}.grid .card small{display:block;font-weight:400}.grid .card .btn{margin-top:auto;width:100%;justify-content:center;text-align:center;padding:6px 8px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.card h3{margin:0}.card p{margin:6px 0}
input[type=search]{width:100%;min-height:48px;font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
ol.steps{padding:0;list-style:none;counter-reset:s}ol.steps li{counter-increment:s;background:var(--card);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;border:2px solid transparent}
ol.steps li::before{content:counter(s);background:var(--red);color:#fff;min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}
ol.steps li.on{border-color:var(--red)}ol.steps label{flex:1;display:flex;gap:10px}ol.steps input{width:26px;height:26px;flex:none}ol.steps input:checked+span{text-decoration:line-through;opacity:.7}
.warn{border-inline-start:6px solid var(--red)}.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{min-height:44px;font:inherit;background:var(--bg);color:var(--tx)}
#call{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;justify-content:center;font-size:1.1rem;min-height:52px;background:#1b7a3a;color:#fff;border-color:#1b7a3a;text-decoration:none;max-width:420px;margin-inline:auto;box-shadow:0 2px 10px #0006}
:root[data-theme=dark] #call{color:#fff}
.note{font-size:.9rem;opacity:.85}.crumb{font-size:.9rem}.crumb a{color:var(--navy)}

function quiz(){app.innerHTML=`<h2>الاختبار</h2><p>اختر المرحلة (10 أسئلة لكل مرحلة). أجب عن الكل بشكل صحيح لتشاهد شاشة الاحتفال!</p><div class="ctl">${Object.keys(LV).map(k=>`<button class="pri" data-k="${k}">${LV[k].n}</button>`).join('')}</div>`;document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>run(b.dataset.k))}
function run(k){let i=0,s=0;const L=LV[k],sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const show=()=>{if(i>=L.q.length){if(s==L.q.length){app.innerHTML=`<div class="card" id="cel" style="text-align:center;position:relative;overflow:hidden"><div aria-hidden="true" id="cf2"></div><div style="font-size:3rem" aria-hidden="true">🎉</div><h2>أحسنت! مبروك، لقد اجتزت اختبار الإسعافات الأولية بنجاح!</h2><p>درجتك: ${s} من ${L.q.length}</p><p>إن تعلّم الإسعافات الأولية خطوة مهمة نحو مساعدة الآخرين. واصل التعلّم، وننصحك بالالتحاق بتدريب عملي معتمد لتطوير مهاراتك واكتساب الثقة اللازمة للتصرف بشكل صحيح في حالات الطوارئ.</p><p><b>تذكّر: النجاح في هذا الاختبار يقيس معرفتك بالمعلومات، لكنه لا يغني عن التدريب العملي المعتمد على الإسعافات الأولية.</b></p><p class="ctl" style="justify-content:center"><a class="btn pri" href="#/">الصفحة الرئيسية</a><a class="btn" href="#/topics">استكشاف الحالات</a><button id="ag">مرحلة أخرى</button></p></div>`;const cf=$('#cf2');for(let i=0;i<24;i++){const e=document.createElement('span');e.textContent=['🎊','✨','⭐'][i%3];e.style.cssText='position:absolute;top:-24px;left:'+(Math.random()*95)+'%;animation:fall '+(3+Math.random()*3)+'s linear '+(Math.random()*2)+'s infinite';cf.append(e)}chime()}else{app.innerHTML=`<h2>نتيجتك في مرحلة ${L.n}: ${s} من ${L.q.length}</h2><p>لم تصل إلى الدرجة الكاملة بعد، وهذا لا بأس به! راجع تعليمات الحالات ثم حاول مرة أخرى، فكل محاولة تقرّبك أكثر.</p><p class="ctl"><button class="pri" id="rt2">أعد المرحلة</button><a class="btn" href="#/topics">راجع الحالات</a><button id="ag">اختر مرحلة أخرى</button></p>`;$('#rt2').onclick=()=>run(k)}$('#ag').onclick=quiz;return}
const q=L.q[i],o=sh([[q[1],1],[q[2],0],[q[3],0]]);app.innerHTML=`<h2>${L.n} — سؤال ${i+1} من ${L.q.length}</h2><p><b>${q[0]}</b></p><div id="o">${o.map(x=>`<p><button data-ok="${x[1]}" style="width:100%;justify-content:start">${x[0]}</button></p>`).join('')}</div><p id="fb" role="status"></p>`;
document.querySelectorAll('#o button').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==1;if(ok)s++;document.querySelectorAll('#o button').forEach(x=>x.disabled=true);$('#fb').innerHTML=(ok?'✅ صحيح. ':'❌ غير صحيح. الإجابة الصحيحة: '+q[1]+'. ')+q[4]+'<p><button class="pri" id="nx">التالي</button></p>';$('#nx').onclick=()=>{i++;show()}})};show()}
const REVIEW={done:false,date:"",reviewer:""};
function chime(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();c.resume&&c.resume();const t=c.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);const s=t+i*.15;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.5);o.start(s);o.stop(s+.55)})}catch(e){}}
function ftr(){$('#ft').innerHTML=`<h2 style="color:var(--red)">تنبيه طبي</h2><p>المعلومات الواردة في هذا الموقع مخصصة للتثقيف والتوعية العامة في مجال الإسعافات الأولية، ولا تُغني عن التقييم الطبي المتخصص أو التدريب العملي المعتمد أو خدمات الطوارئ الطبية.</p><p><b>في حالات الطوارئ، اطلب المساعدة الطبية الطارئة فورًا، واتبع تعليمات موظف الطوارئ.</b></p><p><b>مراجعة المحتوى:</b></p><p>يجب مراجعة المحتوى من مشرف مؤهل قبل النشر.</p>${REVIEW.done?'<p>تمت مراجعة المحتوى من مشرف مؤهل قبل النشر، وتمت الموافقة عليه.</p>':'<p>حالة المراجعة السريرية: <b>لم تكتمل بعد</b>.</p>'}<p>تاريخ المراجعة السريرية: ${REVIEW.done&&REVIEW.date?REVIEW.date:'لم تتم المراجعة بعد'}</p>`}
